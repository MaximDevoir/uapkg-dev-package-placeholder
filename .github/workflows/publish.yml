name: Publish to UAPKG

# Fires when you push a git tag that starts with "v" (e.g. `git push origin v0.1.0`).
# Creating the repo does nothing on its own — you trigger a publish run by pushing a v* tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release + upload the packed asset
  id-token: write # OIDC trusted publishing (audience = UAPKG), used by `uapkg publish`

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing tag $TAG (version $VERSION)"
          MANIFEST_VERSION="$(node -p "require('./uapkg.json').version")"
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::warning::Tag version ($VERSION) does not match uapkg.json version ($MANIFEST_VERSION)"
          fi

      - name: Install UAPKG CLI
        run: npm install -g @uapkg/cli
        # If @uapkg/cli is not on the public npm registry yet, build from source instead:
        #   git clone https://github.com/MaximDevoir/uapkg && cd uapkg
        #   corepack enable && pnpm install && pnpm -r build
        #   then expose packages/uapkg/dist/cli.js on PATH as `uapkg`.

      - name: Pack plugin
        run: |
          mkdir -p dist
          uapkg pack --out-file "dist/uapkg-dev-package-placeholder-${{ steps.version.outputs.version }}.tgz"
          ls -al dist

      - name: Create GitHub Release with packed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Uploads the packed .tgz (and its sibling integrity file) as release assets.
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      # ---------------------------------------------------------------------
      # Publish to the UAPKG registry.
      #
      # NOTE: `uapkg publish` is NOT implemented in the CLI yet, so this step
      # is a placeholder. It intentionally runs AFTER the GitHub Release (and
      # its .tgz asset) exists, because publish submits the *release asset*
      # to the registry. Once the CLI ships `publish`, delete the echoes and
      # uncomment the command below.
      #
      # In GitHub Actions the CLI auto-selects OIDC trusted publishing
      # (audience = UAPKG) — no token or --trusted flag is needed once a
      # trusted publisher rule exists for this package + this workflow. The
      # CLI reads uapkg.json, resolves the release/asset for the current
      # version, and submits POST /v1/registry-requests.
      #
      # Intended command:
      #   uapkg publish --version "${{ steps.version.outputs.version }}"
      #
      # Other options (see the `uapkg publish` command doc):
      #   --otp <code>        # fresh TOTP code, if the server requires one
      #   --registry <name>   # override target registry (defaults to publish.registry)
      #
      # PAT fallback (for the initial publish, before trusted publishing is
      # set up): provide a UAPKG token via a repo secret and let the CLI use
      # it, e.g. add to this step:
      #   env:
      #     UAPKG_TOKEN: ${{ secrets.UAPKG_TOKEN }}
      # ---------------------------------------------------------------------
      - name: Publish to UAPKG registry (placeholder)
        run: |
          echo "uapkg publish is not implemented in the CLI yet — skipping."
          echo "When it lands, this step will run:"
          echo "  uapkg publish --version \"${{ steps.version.outputs.version }}\""
