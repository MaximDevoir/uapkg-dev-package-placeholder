name: Create GitHub releases
run-name: Create ${{ inputs.versions }} with UAPKG ${{ inputs.uapkg_branch }} (${{ inputs.uapkg_environment }})

on:
  workflow_dispatch:
    inputs:
      versions:
        description: Comma-separated SemVers without a leading v (for example, 0.2.0,0.3.0).
        required: true
        type: string
      uapkg_branch:
        description: Branch of MaximDevoir/uapkg to build.
        required: true
        default: main
        type: string
      uapkg_environment:
        description: Endpoint environment stamped into the UAPKG build.
        required: true
        default: development
        type: choice
        options:
          - development
          - production

permissions:
  contents: write

concurrency:
  group: uapkg-dev-package-placeholder-release-mutations
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require a main-branch dispatch
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch so its implementation and release base are unambiguous."
            exit 1
          fi

      - name: Checkout package repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      - name: Capture release base
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Normalize requested versions
        id: versions
        shell: bash
        env:
          RAW_VERSIONS: ${{ inputs.versions }}
        run: |
          set -euo pipefail
          versions_file="$RUNNER_TEMP/release-versions.txt"
          node .github/scripts/release-tools.mjs normalize-versions "$RAW_VERSIONS" > "$versions_file"
          echo "file=$versions_file" >> "$GITHUB_OUTPUT"
          echo "Requested versions:"
          sed 's/^/  - /' "$versions_file"

      - name: Preflight all releases and tags
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS_FILE: ${{ steps.versions.outputs.file }}
        run: |
          set -euo pipefail
          releases_file="$RUNNER_TEMP/existing-releases.txt"
          tags_file="$RUNNER_TEMP/existing-tags.txt"
          plan_file="$RUNNER_TEMP/release-plan.tsv"

          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$releases_file"
          git ls-remote --tags --refs origin | awk '{print $2}' > "$tags_file"
          : > "$plan_file"

          while IFS= read -r version; do
            tag="v$version"
            release_exists=false
            tag_exists=false
            grep -Fqx -- "$tag" "$releases_file" && release_exists=true
            grep -Fqx -- "refs/tags/$tag" "$tags_file" && tag_exists=true

            if [[ "$release_exists" == "true" && "$tag_exists" == "true" ]]; then
              echo "::error::Release and tag $tag already exist. Delete them before rebuilding this fixture."
              exit 1
            fi
            if [[ "$release_exists" == "true" && "$tag_exists" == "false" ]]; then
              echo "::error::Release $tag exists without its tag. Delete the inconsistent release before continuing."
              exit 1
            fi

            if [[ "$tag_exists" == "true" ]]; then
              git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
              if [[ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]]; then
                echo "::error::$tag exists without an annotated tag object and cannot be resumed safely."
                exit 1
              fi
              commit="$(git rev-parse "$tag^{commit}")"
              read -ra ancestry <<< "$(git rev-list --parents -n 1 "$commit")"
              if [[ "${#ancestry[@]}" -ne 2 ]]; then
                echo "::error::$tag must point to a release commit with exactly one parent."
                exit 1
              fi
              parent="${ancestry[1]}"
              if ! git merge-base --is-ancestor "$parent" origin/main; then
                echo "::error::$tag is not based on a commit from main history."
                exit 1
              fi
              mapfile -t resumed_files < <(git diff --name-only "$parent" "$commit" | sort)
              if [[ "${#resumed_files[@]}" -ne 2 || "${resumed_files[0]}" != "UapkgDevPlaceholder.uplugin" || "${resumed_files[1]}" != "uapkg.json" ]]; then
                echo "::error::$tag contains changes beyond the two release version files."
                exit 1
              fi
              verify_root="$RUNNER_TEMP/preflight-$version"
              mkdir -p "$verify_root"
              git show "$commit:uapkg.json" > "$verify_root/uapkg.json"
              git show "$commit:UapkgDevPlaceholder.uplugin" > "$verify_root/UapkgDevPlaceholder.uplugin"
              node .github/scripts/release-tools.mjs verify-version "$verify_root" "$version"
              printf '%s\t%s\n' "$version" resume >> "$plan_file"
            else
              printf '%s\t%s\n' "$version" create >> "$plan_file"
            fi
          done < "$VERSIONS_FILE"

          echo "file=$plan_file" >> "$GITHUB_OUTPUT"
          echo "Release plan:"
          column -t -s $'\t' "$plan_file"

      - name: Build UAPKG from source
        id: uapkg
        uses: ./.github/actions/setup-uapkg
        with:
          branch: ${{ inputs.uapkg_branch }}
          environment: ${{ inputs.uapkg_environment }}

      - name: Create releases
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          PLAN_FILE: ${{ steps.preflight.outputs.file }}
          UAPKG_BRANCH: ${{ inputs.uapkg_branch }}
          UAPKG_ENVIRONMENT: ${{ inputs.uapkg_environment }}
          UAPKG_SOURCE_SHA: ${{ steps.uapkg.outputs.source-sha }}
        run: |
          set -Eeuo pipefail
          mapfile -t entries < "$PLAN_FILE"
          completed=()
          current_index=0
          current_version="preparation"

          report_failure() {
            status=$?
            set +e
            {
              echo "### Release batch stopped"
              echo
              echo "- Failed while processing: \`$current_version\`"
              if (( ${#completed[@]} > 0 )); then
                echo "- Completed: \`$(IFS=,; echo "${completed[*]}")\`"
              fi
              if (( current_index + 1 < ${#entries[@]} )); then
                echo "- Not processed:"
                for ((remaining = current_index + 1; remaining < ${#entries[@]}; remaining++)); do
                  IFS=$'\t' read -r pending_version _ <<< "${entries[$remaining]}"
                  echo "  - \`$pending_version\`"
                done
              fi
              echo
              echo "Completed releases are intentionally preserved. A tag without a release is resumable; delete an incomplete release object explicitly before retrying."
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          }
          trap report_failure ERR

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgSign false
          git config tag.gpgSign false

          worktree_root="$RUNNER_TEMP/release-worktrees"
          assets_root="$RUNNER_TEMP/release-assets"
          mkdir -p "$worktree_root" "$assets_root"

          for current_index in "${!entries[@]}"; do
            IFS=$'\t' read -r current_version disposition <<< "${entries[$current_index]}"
            tag="v$current_version"
            asset_name="uapkg-dev-package-placeholder-$current_version.tgz"
            worktree="$worktree_root/$current_index"
            asset_dir="$assets_root/$current_index"
            asset="$asset_dir/$asset_name"
            mkdir -p "$asset_dir"

            if [[ "$disposition" == "resume" ]]; then
              source_ref="$tag^{commit}"
            else
              source_ref="$BASE_SHA"
            fi
            git worktree add --detach "$worktree" "$source_ref"

            if [[ "$disposition" == "create" ]]; then
              node "$GITHUB_WORKSPACE/.github/scripts/release-tools.mjs" set-version "$worktree" "$current_version"

              mapfile -t changed_files < <(git -C "$worktree" diff --name-only | sort)
              if [[ "${#changed_files[@]}" -ne 2 || "${changed_files[0]}" != "UapkgDevPlaceholder.uplugin" || "${changed_files[1]}" != "uapkg.json" ]]; then
                echo "::error::A release commit may change only uapkg.json and UapkgDevPlaceholder.uplugin."
                printf 'Changed: %s\n' "${changed_files[@]}"
                false
              fi
            fi

            node "$GITHUB_WORKSPACE/.github/scripts/release-tools.mjs" verify-version "$worktree" "$current_version"
            (cd "$worktree" && uapkg pack --outFile "$asset")
            test -s "$asset"
            test -s "$asset.integrity"

            expected_integrity="$(printf 'size-%s\nsha256-%s' \
              "$(stat -c '%s' "$asset")" \
              "$(sha256sum "$asset" | cut -d' ' -f1)")"
            actual_integrity="$(cat "$asset.integrity")"
            if [[ "$actual_integrity" != "$expected_integrity" ]]; then
              echo "::error::The generated archive does not match its integrity sidecar."
              false
            fi

            archive_list="$asset_dir/archive.txt"
            tar -tzf "$asset" > "$archive_list"
            archive_version="${current_version%%+*}"
            prefix="uapkg-dev-package-placeholder-$archive_version"
            grep -Fqx -- "$prefix/uapkg.json" "$archive_list"
            grep -Fqx -- "$prefix/UapkgDevPlaceholder.uplugin" "$archive_list"
            if awk -v expected_prefix="$prefix/" 'index($0, expected_prefix) != 1 { print; invalid = 1 } END { exit invalid }' "$archive_list"; then
              :
            else
              echo "::error::The packed archive contains entries outside $prefix/."
              false
            fi
            if grep -Eq '(^|/)(\.git|\.github|\.uapkg-source|dist)(/|$)' "$archive_list"; then
              echo "::error::The packed archive contains repository or build metadata."
              grep -E '(^|/)(\.git|\.github|\.uapkg-source|dist)(/|$)' "$archive_list"
              false
            fi

            archive_source="$asset_dir/archive-source"
            mkdir -p "$archive_source"
            tar -xOf "$asset" "$prefix/uapkg.json" > "$archive_source/uapkg.json"
            tar -xOf "$asset" "$prefix/UapkgDevPlaceholder.uplugin" > "$archive_source/UapkgDevPlaceholder.uplugin"
            node "$GITHUB_WORKSPACE/.github/scripts/release-tools.mjs" verify-version "$archive_source" "$current_version"

            if [[ "$disposition" == "create" ]]; then
              git -C "$worktree" add uapkg.json UapkgDevPlaceholder.uplugin
              git -C "$worktree" -c commit.gpgSign=false commit -m "chore(release): $tag"
              release_sha="$(git -C "$worktree" rev-parse HEAD)"

              mapfile -t committed_files < <(git diff --name-only "$BASE_SHA" "$release_sha" | sort)
              if [[ "${#committed_files[@]}" -ne 2 || "${committed_files[0]}" != "UapkgDevPlaceholder.uplugin" || "${committed_files[1]}" != "uapkg.json" ]]; then
              echo "::error::The tag-only release commit contains unexpected changes."
              printf 'Changed: %s\n' "${committed_files[@]}"
              false
              fi

              git -c tag.gpgSign=false tag -a "$tag" "$release_sha" -m "$tag"
              git push origin "refs/tags/$tag:refs/tags/$tag"
            fi

            notes_file="$asset_dir/release-notes.md"
            {
              echo "Development fixture release for UAPKG publishing tests."
              echo
              echo "- Package version: \`$current_version\`"
              echo "- UAPKG source: \`MaximDevoir/uapkg@$UAPKG_SOURCE_SHA\`"
              echo "- UAPKG branch input: \`$UAPKG_BRANCH\`"
              echo "- UAPKG build environment: \`$UAPKG_ENVIRONMENT\`"
              echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > "$notes_file"

            gh release create "$tag" "$asset" "$asset.integrity" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$tag" \
              --notes-file "$notes_file"

            completed+=("$current_version")
            git worktree remove "$worktree"
          done

          trap - ERR
          {
            echo "### Releases created"
            echo
            for version in "${completed[@]}"; do
              echo "- \`v$version\`"
            done
            echo
            echo "UAPKG source: \`$UAPKG_SOURCE_SHA\` ($UAPKG_ENVIRONMENT)"
          } >> "$GITHUB_STEP_SUMMARY"
